name: Kanyu
options:
  bundleIdPrefix: com.kanyu
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Kanyu:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanyu.survey
        PRODUCT_NAME: Kanyu
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 堪舆勘察
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: 勘察拍照与录像需要使用相机，照片会烙印当时的罗盘方位。
        NSMicrophoneUsageDescription: 勘察录像需要录制环境声音。
        NSLocationWhenInUseUsageDescription: 罗盘定向与照片定位需要位置与方向信息，用于计算真北方位与磁偏角。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
