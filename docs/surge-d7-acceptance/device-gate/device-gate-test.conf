# Surge 5 test profile — device-side independent security gate (P0-E).
# INDEPENDENT TEST PROFILE. Not production. Never import production groups.
# All test proxies use TEST-NET 192.0.2.0/24 + password test123 only.
# No real node URI, token, real egress IP or production subscription
# appears in this file.
#
# Safety shape (the gate under test):
#   - SCRIPT rule FIRST: gate-rule decides per request, on the device,
#     from the lease in $persistentStore. matched=true admits the request
#     to the gated select group; matched=false (no lease / expired /
#     STOP / SHA mismatch / network change / boot mismatch / selection
#     mismatch / clock anomaly / corrupt state / any script failure)
#     falls through to FINAL,REJECT.
#   - The SCRIPT rule is the ONLY non-FINAL rule. There is no DIRECT
#     anywhere, no other policy group, no RULE-SET, no GEOIP, no nested
#     smart/fallback/url-test group: nothing can bypass the gate.
#   - FINAL,REJECT is the last rule. If the gate script is missing or
#     scripting is disabled, the manual says the SCRIPT rule "is treated
#     as not matched", so evaluation falls through to FINAL,REJECT.
#   - The select group keeps REJECT as its first member (never-selected
#     default), but the fail-closed property does NOT depend on it: it
#     depends on the per-request SCRIPT verdict above.
#   - Event scripts revoke the lease + force REJECT on engine-started
#     (reboot), network-changed and profile-reloaded. A cron sweep every
#     10 minutes (6 runs/hour, under the manual's 10/hour battery-warning
#     threshold) removes expired leases and forces REJECT as backup only.
#   - http-api below listens on ALL interfaces (0.0.0.0) so the gate
#     controller can reach the device HTTP API from a computer on the
#     same LAN while this test profile is loaded. The key test123 is a
#     non-secret test key by design. (127.0.0.1-only refused LAN
#     connections from the desktop controller: WinError 10061.)
#     Remove it before any non-test use.
#
# Outbound mode MUST stay "rule": in "global-proxy" mode Surge does not
# evaluate rules at all and this gate cannot apply. That is a documented
# boundary (see device-gate/README.md), not something the profile can
# enforce.

[General]
loglevel = notify
ipv6 = false
test-timeout = 5
http-api = test123@0.0.0.0:6171
# No external subscription / no MITM in this test profile.

[Proxy]
Test-Proxy-1 = trojan, 192.0.2.1, 443, password=test123, sni=test.invalid
Test-Proxy-2 = trojan, 192.0.2.2, 443, password=test123, sni=test.invalid
Test-Proxy-3 = trojan, 192.0.2.3, 443, password=test123, sni=test.invalid

[Proxy Group]
测试安全出口 = select, REJECT, Test-Proxy-1, Test-Proxy-2, Test-Proxy-3

[Script]
gate-rule = type=rule,script-path=https://muse.ai/files/1301667319702374/1446469247638999/3unbjswxf2r5lva5zovqntzb/gate-script.js,engine=jsc
gate-events-boot = type=event,event-name=engine-started,script-path=https://muse.ai/files/1301667319702374/2040637863307628/hs4oiq6wav8aaj607vrkrtqd/gate-events.js,engine=jsc
gate-events-net = type=event,event-name=network-changed,script-path=https://muse.ai/files/1301667319702374/2040637863307628/hs4oiq6wav8aaj607vrkrtqd/gate-events.js,engine=jsc
gate-events-profile = type=event,event-name=profile-reloaded,script-path=https://muse.ai/files/1301667319702374/2040637863307628/hs4oiq6wav8aaj607vrkrtqd/gate-events.js,engine=jsc
gate-sweep = type=cron,cronexp="*/10 * * * *",script-path=https://muse.ai/files/1301667319702374/4500241730190160/kq2s0zm4k3iy3iwmyghf3zql/gate-sweep.js,engine=jsc

[Rule]
SCRIPT,gate-rule,测试安全出口
FINAL,REJECT
