# Surge 5 test profile — fail-closed safe egress (A1).
# INDEPENDENT TEST PROFILE. Not production. Never import production groups.
# All test proxies use TEST-NET 192.0.2.0/24 + password test123 only.
# No real node URI, token or real egress IP appears in this file.
#
# Safety shape:
#   - select group "测试安全出口", first member REJECT (fail-closed default)
#   - no DIRECT anywhere, no nested Smart / fallback / url-test groups
#   - only example.com uses the test egress; everything else FINAL,REJECT

[General]
loglevel = notify
ipv6 = false
test-timeout = 5
# No external subscription / no MITM in this test profile.

[Proxy]
Test-Proxy-1 = trojan, 192.0.2.1, 443, password=test123, sni=test.invalid
Test-Proxy-2 = trojan, 192.0.2.2, 443, password=test123, sni=test.invalid
Test-Proxy-3 = trojan, 192.0.2.3, 443, password=test123, sni=test.invalid

[Proxy Group]
测试安全出口 = select, REJECT, Test-Proxy-1, Test-Proxy-2, Test-Proxy-3

[Rule]
DOMAIN-SUFFIX,example.com,测试安全出口
FINAL,REJECT
