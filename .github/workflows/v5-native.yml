name: V5 native architecture regression
on:
  push:
    branches: [codex/v5-oriental-pro-redesign, codex/v5-artwork-integration-20261128]
permissions:
  contents: read
jobs:
  native:
    if: startsWith(github.event.head_commit.message, '[acceptance]')
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 design/verify_v6.py
      - name: Toolchain
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Complete unit suite including formal posters and native lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git rev-parse HEAD > build/commit.txt
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for v in d.values() for x in v if 'iPhone' in x['name']))")
          xcodebuild test -project Kanyu.xcodeproj -scheme Kanyu -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath build/DD -clonedSourcePackagesDirPath build/SourcePackages -resultBundlePath build/Share.xcresult CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -only-testing:KanyuTests -only-testing:KanyuUITests/V5NavigationUITests -only-testing:KanyuUITests/V5PersonLifecycleUITests 2>&1 | tee build/share.log
      - name: Formal Photos and PDF system sharing on isolated fixed-person simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["identifier"].split(".")[-1].startswith("iOS-26")))')
          DEST=$(xcrun simctl create 'Kanyu V5 Sharing Gate' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$RUNTIME")
          echo "$DEST" > build/sharing-destination.txt
          xcrun simctl boot "$DEST"
          xcrun simctl bootstatus "$DEST" -b
          xcrun simctl install "$DEST" build/DD/Build/Products/Debug-iphonesimulator/Kanyu.app
          CONTAINER=$(xcrun simctl get_app_container "$DEST" com.kanyu.survey data)
          test -n "$CONTAINER"
          test ! -f "$CONTAINER/Documents/people.json"
          mkdir -p "$CONTAINER/Documents"
          cp design/v5/visual-fixture.json "$CONTAINER/Documents/people.json"
          cp design/v5/visual-fixture.json build/sharing-fixture.json
          xcrun simctl privacy "$DEST" grant photos-add com.kanyu.survey
          xcodebuild test-without-building -project Kanyu.xcodeproj -scheme Kanyu -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath build/DD -clonedSourcePackagesDirPath build/SourcePackages -resultBundlePath build/Sharing.xcresult -parallel-testing-enabled NO -only-testing:KanyuUITests/V5PosterSharingUITests -only-testing:KanyuUITests/V5PublicationSharingUITests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/sharing.log
          python3 - <<'PYTEST'
          from pathlib import Path
          log = Path('build/sharing.log').read_text()
          for case in ['V5PosterSharingUITests testFormalBaziPhotoAndSharePreserveSelectedOwner', 'V5PublicationSharingUITests testRealPublicationShareReturnsToTheSameOwner']:
              assert "Test Case '-[KanyuUITests." + case + "]' passed" in log, 'Required real sharing test did not execute and pass: ' + case
          PYTEST
      - name: Build unsigned engineering candidate
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -project Kanyu.xcodeproj -scheme Kanyu -configuration Release -sdk iphoneos -derivedDataPath build/DeviceDD -clonedSourcePackagesDirPath build/SourcePackages CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/device-build.log
          mkdir -p Payload
          cp -R build/DeviceDD/Build/Products/Release-iphoneos/Kanyu.app Payload/
          zip -qry Kanyu-5.0-709-unsigned-engineering.ipa Payload
          codesign -dv --verbose=4 Payload/Kanyu.app > build/signature-status.txt 2>&1 || true
          python3 design/v5/verify_ipa.py Kanyu-5.0-709-unsigned-engineering.ipa --version 5.0 --build 709 --output build/candidate-integrity.json
      - uses: actions/upload-artifact@v4
        with:
          name: Kanyu-5.0-709-unsigned-engineering-${{ github.sha }}
          path: |
            Kanyu-5.0-709-unsigned-engineering.ipa
            Kanyu-5.0-709-unsigned-engineering.ipa.sha256
            build/candidate-integrity.json
            build/signature-status.txt
            build/commit.txt
          retention-days: 14
      - name: Attachments
        if: always()
        run: |
          for RESULT in Share Sharing; do
            if [ -d "build/$RESULT.xcresult" ]; then
              xcrun xcresulttool export attachments --path "build/$RESULT.xcresult" --output-path "build/attachments/$RESULT" || true
              xcrun xcresulttool get test-results summary --path "build/$RESULT.xcresult" > "build/$RESULT-summary.json" 2> "build/$RESULT-summary-error.log" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-native-${{ github.sha }}
          path: |
            build/*.log
            build/commit.txt
            build/Share.xcresult
            build/Sharing.xcresult
            build/*-summary.json
            build/sharing-fixture.json
            build/sharing-destination.txt
            build/attachments
          retention-days: 14
  provenance:
    if: startsWith(github.event.head_commit.message, '[acceptance]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - run: |
          mkdir -p build/source-trust
          swiftc Sources/InterpretSourceLabelPolicy.swift design/qa/InterpretSourceLabelPolicyCheck.swift -o build/source-trust/check
          build/source-trust/check 2>&1 | tee build/source-trust/result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-source-trust-${{ github.sha }}
          path: build/source-trust/result.log
