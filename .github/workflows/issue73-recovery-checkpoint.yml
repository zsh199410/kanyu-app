name: Issue73 signed recovery checkpoint and snapshot rollback (isolated)
on:
  pull_request:
    paths:
      - "docs/surge-bridge-c3c0/recovery_signed_checkpoint.py"
      - "docs/surge-bridge-c3c0/test_recovery_signed_checkpoint.py"
      - "docs/surge-bridge-c3c0/EXTERNAL_RECOVERY_CHECKPOINT_GATE.md"
      - ".github/workflows/issue73-recovery-checkpoint.yml"
permissions:
  contents: read
jobs:
  synthetic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned test-only cryptography dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Syntax check
        run: |
          python -m py_compile docs/surge-bridge-c3c0/recovery_signed_checkpoint.py
          python -m py_compile docs/surge-bridge-c3c0/test_recovery_signed_checkpoint.py
      - name: Real SQLite backup restore and signed external checkpoint negatives
        working-directory: docs/surge-bridge-c3c0
        run: python -W error::ResourceWarning -m unittest -v test_recovery_signed_checkpoint.py
