name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每日 06:00 北京时间自动发包（UTC 22:00）：静态审查＋GoldenCharts 金标准门禁＋发布 IPA
    - cron: '0 22 * * *'

permissions:
  contents: write

# Prevent overlapping scheduled and push builds from publishing competing releases.
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK / Liquid Glass)
        run: |
          ls /Applications | grep -i xcode || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Golden charts test (golden-chart gate)
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; u=[x['udid'] for v in d.values() for x in v if 'iPhone' in x.get('name','') and x.get('isAvailable', True)]; print(u[0] if u else '')")
          echo "simulator UDID: $DEST"
          test -n "$DEST"
          xcodebuild test -project Kanyu.xcodeproj -scheme Kanyu -destination "platform=iOS Simulator,id=$DEST" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Build (unsigned)
        run: |
          xcodebuild -project Kanyu.xcodeproj -scheme Kanyu \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -derivedDataPath build/DD build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/DD/Build/Products/Release-iphoneos/Kanyu.app" Payload/
          zip -qry Kanyu-unsigned.ipa Payload
          ls -lh Kanyu-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kanyu-unsigned-ipa
          path: Kanyu-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 三术合参 未签名 IPA（第 ${{ github.run_number }} 次构建）
          body: 未签名 IPA：用开发者证书签名后安装（全能签 / ESign / Feather 等）。数据包格式见仓库 README。
          files: Kanyu-unsigned.ipa
