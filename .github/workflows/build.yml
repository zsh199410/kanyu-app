name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Kanyu.xcodeproj -scheme Kanyu \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DD build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/DD/Build/Products/Release-iphoneos/Kanyu.app" Payload/
          zip -qry Kanyu-unsigned.ipa Payload
          ls -lh Kanyu-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kanyu-unsigned-ipa
          path: Kanyu-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 堪舆勘察 未签名 IPA（第 ${{ github.run_number }} 次构建）
          body: 未签名 IPA：用开发者证书签名后安装（全能签 / ESign / Feather 等）。数据包格式见仓库 README。
          files: Kanyu-unsigned.ipa
