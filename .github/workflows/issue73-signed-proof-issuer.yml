name: Issue73 C3-C1 signed proof issuer integration (isolated)
on:
  pull_request:
    paths:
      - "docs/surge-bridge-c3c0/signed_proof_issuer.py"
      - "docs/surge-bridge-c3c0/test_signed_proof_issuer.py"
      - "docs/surge-bridge-c3c0/test_signed_proof_interop_fixture.py"
      - "docs/surge-bridge-c3c0/test_signed_proof_issuer_webview.js"
      - "docs/surge-bridge-c3c0/SIGNED_PROOF_ISSUER_GATE.md"
      - ".github/workflows/issue73-signed-proof-issuer.yml"
permissions:
  contents: read
jobs:
  proof-issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test-only Ed25519 dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Python syntax
        run: |
          python -m py_compile docs/surge-bridge-c3c0/signed_proof_issuer.py
          python -m py_compile docs/surge-bridge-c3c0/test_signed_proof_issuer.py
          python -m py_compile docs/surge-bridge-c3c0/test_signed_proof_interop_fixture.py
          node --check docs/surge-bridge-c3c0/test_signed_proof_issuer_webview.js
      - name: Server signer and SQLite 16 adversarial tests
        working-directory: docs/surge-bridge-c3c0
        run: python -W error::ResourceWarning -m unittest -v test_signed_proof_issuer.py
      - name: Verify Python signature in actual browser WebCrypto library
        working-directory: docs/surge-bridge-c3c0
        run: node test_signed_proof_issuer_webview.js
