name: V5 PDFKit original evidence diagnostic
on:
  push:
    branches: [codex/v5-oriental-pro-redesign]
    paths: [design/v5/inspect_pdfkit.swift, design/v5/probe_pdf_font.swift, .github/workflows/v5-pdf-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v5-actual-ui-306f534bb96e57726ba3bda87612a7b5da44d512
          run-id: 45958565676
          github-token: ${{ github.token }}
          path: build/prior
      - name: Read original export with platform PDFKit
        run: swift design/v5/inspect_pdfkit.swift build/prior/attachments/PDF build/pdfkit-original.json
      - name: Probe same-family TrueType text mapping without changing app fonts
        run: |
          curl -L --fail 'https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/notoserifsc/NotoSerifSC%5Bwght%5D.ttf' -o build/probe.ttf
          echo '050080d9255a86808f2945bffac582b31ef32bc36411ce29563b4961670c66f9  build/probe.ttf' | shasum -a 256 -c
          swift design/v5/probe_pdf_font.swift build/probe.ttf build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-pdfkit-original-${{ github.sha }}
          path: |
            build/pdfkit-original.json
            build/font-probe.json
            build/font-probe-*.pdf
