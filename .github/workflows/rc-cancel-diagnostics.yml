name: RC context cancellation diagnostics (isolated PR)

# Isolated diagnostic workflow: never changes existing RC workflows or test/golden sources.
# PR-scoped diagnostics run without merging to default branch.
# Checkout is pinned to the PR head SHA rather than GitHub's synthetic merge ref.
on:
  pull_request:
    branches: [qa/poster-export-acceptance-20261117]
    paths: ['.github/workflows/rc-cancel-diagnostics.yml']

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        suite: [profile, illustrated]
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "Expected: $EXPECTED_SHA"
          echo "Actual:   $ACTUAL"
          test "${#EXPECTED_SHA}" -eq 40
          test "$ACTUAL" = "$EXPECTED_SHA"
      - name: Capture runner environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available
      - name: Verify protected sources
        run: python3 design/verify_v6.py
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Reproduce one dark-standard XCTest context
        env:
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SUITE" = "illustrated" ]; then
            python3 design/run_context_acceptance.py --suite guides --case dark-standard
          else
            python3 design/run_context_acceptance.py --case dark-standard
          fi
      - name: Preserve raw context evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-cancel-diagnostic-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/context-evidence
          if-no-files-found: warn
          retention-days: 14
