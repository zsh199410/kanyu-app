name: Issue73 actual TLS recovery-fenced HTTPS admission (isolated)
on:
  pull_request:
    paths:
      - "docs/surge-bridge-c3c0/staging_issuance_drain.py"
      - "docs/surge-bridge-c3c0/staging_recovery_fenced_https.py"
      - "docs/surge-bridge-c3c0/test_staging_recovery_fenced_https.py"
      - "docs/surge-bridge-c3c0/RECOVERY_FENCED_HTTPS_GATE.md"
      - ".github/workflows/issue73-gated-https-recovery.yml"
permissions:
  contents: read
jobs:
  real-tls-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned test-only Ed25519 library
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Syntax checks
        run: |
          python -m py_compile docs/surge-bridge-c3c0/staging_issuance_drain.py
          python -m py_compile docs/surge-bridge-c3c0/staging_recovery_fenced_https.py
          python -m py_compile docs/surge-bridge-c3c0/test_staging_recovery_fenced_https.py
      - name: Real TLS requests, fork-safe cold start, signed recovery, nonce and revoke fences
        working-directory: docs/surge-bridge-c3c0
        run: python -W error::ResourceWarning -m unittest -v test_staging_recovery_fenced_https.py
      - name: Existing drain and rollback-checkpoint regressions
        working-directory: docs/surge-bridge-c3c0
        run: |
          python -W error::ResourceWarning -m unittest -v test_staging_issuance_drain.py
          python -W error::ResourceWarning -m unittest -v test_recovery_signed_checkpoint.py
