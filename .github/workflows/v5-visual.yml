name: V5 actual native UI evidence (visual approval separate)
on:
  push:
    branches: [codex/v5-oriental-pro-redesign]
permissions:
  contents: read
jobs:
  actual-ui:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 design/verify_v6.py
      - name: Build native simulator app and UI tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git rev-parse HEAD > build/commit.txt
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["identifier"].split(".")[-1].startswith("iOS-26")))')
          DEST=$(xcrun simctl create 'Kanyu V5 Fixed Visual' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$RUNTIME")
          echo "$DEST" > build/destination.txt
          xcodebuild build-for-testing -project Kanyu.xcodeproj -scheme Kanyu -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath build/DD -clonedSourcePackagesDirPath build/SourcePackages CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/compile.log
          xcrun simctl boot "$DEST"
          xcrun simctl bootstatus "$DEST" -b
          xcrun simctl status_bar "$DEST" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEST" build/DD/Build/Products/Debug-iphonesimulator/Kanyu.app
          CONTAINER=$(xcrun simctl get_app_container "$DEST" com.kanyu.survey data)
          test -n "$CONTAINER"
          test ! -f "$CONTAINER/Documents/people.json"
          mkdir -p "$CONTAINER/Documents"
          cp design/v5/visual-fixture.json "$CONTAINER/Documents/people.json"
          cp design/v5/visual-fixture.json build/fixture.json
      - name: Verify actual four-theme publication PDFs
        shell: bash
        run: |
          set -euo pipefail
          DEST=$(cat build/destination.txt)
          xcodebuild test-without-building -project Kanyu.xcodeproj -scheme Kanyu -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath build/DD -clonedSourcePackagesDirPath build/SourcePackages -resultBundlePath build/PDF.xcresult -parallel-testing-enabled NO -only-testing:KanyuTests/V5PublicationStyleTests -only-testing:KanyuTests/V5FormalPDFExportTests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/pdf.log
      - name: Capture actual four-theme screens on identical data
        shell: bash
        run: |
          set -euo pipefail
          DEST=$(cat build/destination.txt)
          xcodebuild test-without-building -project Kanyu.xcodeproj -scheme Kanyu -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath build/DD -clonedSourcePackagesDirPath build/SourcePackages -resultBundlePath build/Visual.xcresult -parallel-testing-enabled NO -only-testing:KanyuUITests/V5VisualAcceptanceTests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/visual.log
      - name: Preserve actual screenshots and comparison
        if: always()
        run: |
          if [ -d build/Visual.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Visual.xcresult --output-path build/attachments/Visual
            python3 -m venv build/qa-env
            build/qa-env/bin/pip -q install matplotlib
            build/qa-env/bin/python design/v5/package_visual_evidence.py build/attachments/Visual build/comparison
          fi
          if [ -d build/PDF.xcresult ]; then
            xcrun xcresulttool export attachments --path build/PDF.xcresult --output-path build/attachments/PDF
          fi
      - name: Required art readiness (does not grant visual approval)
        if: always()
        run: python3 design/v5/verify_artwork.py --output build/artwork-readiness.json --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-actual-ui-${{ github.sha }}
          path: |
            build/*.log
            build/*.json
            build/commit.txt
            build/destination.txt
            build/Visual.xcresult
            build/PDF.xcresult
            build/attachments
            build/comparison
          retention-days: 14
