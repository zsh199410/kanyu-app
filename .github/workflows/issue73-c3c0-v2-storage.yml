name: Issue73 C3-C0 v2 durable-store regression
on:
  pull_request:
    paths:
      - "docs/surge-bridge-c3c0/bridge_fixed_v2.js"
      - "docs/surge-bridge-c3c0/test_store_failure.js"
      - ".github/workflows/issue73-c3c0-v2-storage.yml"
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check docs/surge-bridge-c3c0/bridge_fixed_v2.js
          node --check docs/surge-bridge-c3c0/test_store_failure.js
      - name: Actual v2 storage failure injections (no network)
        run: node docs/surge-bridge-c3c0/test_store_failure.js
