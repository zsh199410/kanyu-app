name: Issue73 C3-C0 Round 9 cross-review probes (isolated)
on:
  pull_request:
    paths:
      - "docs/surge-bridge-c3c0/test_r9_cross_review_probes.py"
      - "docs/surge-bridge-c3c0/test_r9_js_verify_helper.js"
      - "docs/surge-bridge-c3c0/credential_proof_https.py"
      - "docs/surge-bridge-c3c0/surge_webview_crypto_probe.template.js"
      - "docs/surge-bridge-c3c0/surge_purejs_signed_proof.review.js"
      - "docs/surge-bridge-c3c0/atomic_signed_proof_issuer.py"
      - "docs/surge-bridge-c3c0/token_registry_sqlite.py"
      - "docs/surge-bridge-c3c0/nonce_ledger_sqlite.py"
      - ".github/workflows/issue73-c3c0-round9.yml"
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test-only Ed25519 dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Compile isolated server-side reference
        run: python -m py_compile docs/surge-bridge-c3c0/credential_proof_https.py docs/surge-bridge-c3c0/atomic_signed_proof_issuer.py docs/surge-bridge-c3c0/token_registry_sqlite.py docs/surge-bridge-c3c0/nonce_ledger_sqlite.py docs/surge-bridge-c3c0/test_r9_cross_review_probes.py
      - name: Syntax-check cross-language JS verifier helper
        run: node --check docs/surge-bridge-c3c0/test_r9_js_verify_helper.js
      - name: Run 5 Round 9 cross-review probes (P1 insecure_context precedence; P2/P3 Python-issuer to pure-JS verifier chain incl. real HTTPS; P4 loopback/TLS binding; P5 wrong-bearer zero-write)
        working-directory: docs/surge-bridge-c3c0
        run: python -W error::ResourceWarning -m unittest -v test_r9_cross_review_probes.py
