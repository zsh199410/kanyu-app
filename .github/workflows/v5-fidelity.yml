name: V5 fidelity engineering focused regression
on:
  push:
    branches: [codex/v5-pro-fidelity-20261128]
permissions:
  contents: read
jobs:
  artwork-and-export:
    if: startsWith(github.event.head_commit.message, '[fidelity]') || startsWith(github.event.head_commit.message, '[share-ui]')
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 design/verify_v6.py
      - run: python3 -m unittest discover -s design/v5 -p 'test_artwork_validation.py' -v
      - name: Build native simulator app and UI tests
        id: native-build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          git rev-parse HEAD > build/commit.txt
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["identifier"].split(".")[-1].startswith("iOS-26")))')
          DEST=$(xcrun simctl create 'Kanyu V5 Fixed Visual' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$RUNTIME")
          echo "$DEST" > build/destination.txt
          xcodebuild build-for-testing -project Kanyu.xcodeproj -scheme Kanyu -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath build/DD -clonedSourcePackagesDirPath build/SourcePackages CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/compile.log
          xcrun simctl boot "$DEST"
          xcrun simctl bootstatus "$DEST" -b
          xcrun simctl status_bar "$DEST" override --time '9:41' --batteryState discharging --batteryLevel 100 --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4
          xcrun simctl install "$DEST" build/DD/Build/Products/Debug-iphonesimulator/Kanyu.app
          CONTAINER=$(xcrun simctl get_app_container "$DEST" com.kanyu.survey data)
          test -n "$CONTAINER"
          test ! -f "$CONTAINER/Documents/people.json"
          mkdir -p "$CONTAINER/Documents"
          cp design/v5/visual-fixture.json "$CONTAINER/Documents/people.json"
          cp design/v5/visual-fixture.json build/fixture.json
      - name: Verify isolated artwork and formal export units
        if: ${{ !startsWith(github.event.head_commit.message, '[share-ui]') }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          DEST=$(cat build/destination.txt)
          xcodebuild test-without-building -project Kanyu.xcodeproj -scheme Kanyu -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath build/DD -clonedSourcePackagesDirPath build/SourcePackages -resultBundlePath build/FidelityUnits.xcresult -parallel-testing-enabled NO -only-testing:KanyuTests/V5PosterShareItemTests -only-testing:KanyuTests/V5ArtworkStoreTests -only-testing:KanyuTests/V5FormalPDFExportTests -only-testing:KanyuTests/PosterFamilyExportPathTests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/units.log
      - name: Verify real four-tab Photos and system share lifecycle
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          DEST=$(cat build/destination.txt)
          xcrun simctl privacy "$DEST" grant photos-add com.kanyu.survey
          xcrun simctl spawn "$DEST" log stream --style compact --level info --predicate 'process == "Kanyu" OR subsystem CONTAINS "ShareSheet" OR process CONTAINS "ShareSheet" OR process == "sharingd"' > build/sharing-system.log 2>&1 &
          DIAGNOSTIC_PID=$!
          trap 'kill "$DIAGNOSTIC_PID" 2>/dev/null || true' EXIT
          xcodebuild test-without-building -project Kanyu.xcodeproj -scheme Kanyu -destination "platform=iOS Simulator,id=$DEST" -derivedDataPath build/DD -clonedSourcePackagesDirPath build/SourcePackages -resultBundlePath build/FidelityUI.xcresult -parallel-testing-enabled NO -only-testing:KanyuUITests/V5PosterSharingUITests CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/ui.log
      - name: Preserve original evidence and actual asset readiness
        if: always()
        run: |
          for RESULT in FidelityUnits FidelityUI; do
            if [ -d "build/$RESULT.xcresult" ]; then
              xcrun xcresulttool export attachments --path "build/$RESULT.xcresult" --output-path "build/attachments/$RESULT" || true
              xcrun xcresulttool export diagnostics --path "build/$RESULT.xcresult" --output-path "build/diagnostics/$RESULT" || true
            fi
          done
          python3 design/v5/verify_artwork.py --output build/artwork-readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-fidelity-focused-${{ github.sha }}
          path: |
            build/*.log
            build/*.json
            build/commit.txt
            build/destination.txt
            build/FidelityUnits.xcresult
            build/FidelityUI.xcresult
            build/diagnostics
            build/attachments
          retention-days: 14
