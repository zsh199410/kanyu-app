name: Issue73 remote TLS anchor authority and pinned client (isolated)
on:
  pull_request:
    paths:
      - "docs/surge-bridge-c3c0/remote_anchor_https_staging.py"
      - "docs/surge-bridge-c3c0/test_remote_anchor_https_staging.py"
      - "docs/surge-bridge-c3c0/REMOTE_ANCHOR_TLS_STAGING_GATE.md"
      - ".github/workflows/issue73-remote-anchor-tls.yml"
permissions:
  contents: read
jobs:
  remote-anchor-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned isolated cryptography library
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Ensure pure Python source compiles
        run: |
          python -m py_compile docs/surge-bridge-c3c0/remote_anchor_https_staging.py
          python -m py_compile docs/surge-bridge-c3c0/test_remote_anchor_https_staging.py
      - name: Real dual-loopback TLS signed anchor and PR115 integration tests
        working-directory: docs/surge-bridge-c3c0
        run: python -W error::ResourceWarning -m unittest -v test_remote_anchor_https_staging.py
      - name: Existing PR115 fail-closed recovery HTTPS, PR114 and original HTTPS suites
        working-directory: docs/surge-bridge-c3c0
        run: |
          python -W error::ResourceWarning -m unittest -v test_staging_recovery_fenced_https.py
          python -W error::ResourceWarning -m unittest -v test_recovery_signed_checkpoint.py
          python -W error::ResourceWarning -m unittest -v test_credential_proof_https.py
