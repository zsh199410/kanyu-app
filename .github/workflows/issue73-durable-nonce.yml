name: Issue73 C3-C1 durable nonce replay isolated
on:
  pull_request:
    paths:
      - "docs/surge-bridge-c3c0/nonce_ledger_sqlite.py"
      - "docs/surge-bridge-c3c0/test_nonce_ledger_sqlite.py"
      - "docs/surge-bridge-c3c0/DURABLE_NONCE_LEDGER_GATE.md"
      - ".github/workflows/issue73-durable-nonce.yml"
permissions:
  contents: read
jobs:
  sqlite-nonce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated server-side reference
        run: python3 -m py_compile docs/surge-bridge-c3c0/nonce_ledger_sqlite.py docs/surge-bridge-c3c0/test_nonce_ledger_sqlite.py
      - name: Run 21 real SQLite adversarial cases in owner-only temporary directories
        working-directory: docs/surge-bridge-c3c0
        run: python3 -W error::ResourceWarning -m unittest -v test_nonce_ledger_sqlite.py
