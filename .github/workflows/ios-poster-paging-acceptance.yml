name: iOS Poster paging and plain-language acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'Sources/PosterPage*.swift'
      - 'Sources/PosterPlainGuide.swift'
      - 'Sources/PosterDynamicTemplateView.swift'
      - 'design/qa/PosterPageLayoutTests.swift'
      - 'design/qa/PosterDynamicSnapshotTests.swift'
      - '.github/workflows/ios-poster-paging-acceptance.yml'
  push:
    branches:
      - feat/ios-poster-paging-readable-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poster-paging-tests:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify locked tests and design contracts
        run: |
          python3 design/verify_v6.py
          python3 design/verify_web_source.py
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Stage opt-in new tests only inside temporary CI checkout
        run: |
          cp design/qa/PosterPageLayoutTests.swift Tests/PosterPageLayoutTests.swift
          cp design/qa/PosterDynamicSnapshotTests.swift Tests/PosterDynamicSnapshotTests.swift
          xcodegen generate
      - name: Run exact-head PNG pagination regressions
        run: |
          set -o pipefail
          mkdir -p build
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; u=[x['udid'] for v in d.values() for x in v if 'iPhone' in x.get('name','') and x.get('isAvailable', True)]; print(u[0] if u else '')")
          test -n "$DEST"
          xcodebuild test \
            -project Kanyu.xcodeproj -scheme Kanyu \
            -destination "platform=iOS Simulator,id=$DEST" \
            -only-testing:KanyuTests/PosterPageLayoutTests \
            -only-testing:KanyuTests/PosterDynamicSnapshotTests \
            -resultBundlePath build/PosterPageTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/poster-paging-tests.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-paging-${{ github.sha }}
          path: |
            build/poster-paging-tests.log
            build/PosterPageTests.xcresult
          if-no-files-found: warn
          retention-days: 30
